name: Dependency audit

on:
  push:
    paths: ["requirements*", ".github/workflows/dependency-audit.yml"]
  pull_request:
    paths: ["requirements*", ".github/workflows/dependency-audit.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lock: [requirements.lock, requirements-dev.lock, requirements-windows.lock, requirements-build-linux.lock]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned dependencies through PyPI
        env:
          REQUIREMENTS_LOCK: ${{ matrix.lock }}
        run: pip-audit --disable-pip --no-deps --vulnerability-service pypi --progress-spinner off -r "$REQUIREMENTS_LOCK"
