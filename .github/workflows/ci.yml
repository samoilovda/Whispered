name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.1.1 pytest-cov ruff==0.15.20 mypy==1.17.1

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q -x '__pycache__|\.git|venv|\.venv' .

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Type check (mypy, informational)
        # Not a merge gate yet: the codebase isn't fully typed. Surfaced as a
        # visible (but non-blocking) CI result so regressions are seen early.
        continue-on-error: true
        run: |
          mypy --ignore-missing-imports core/ transcriber.py diarizer.py exporters.py utils.py config.py

      - name: Run unit tests with coverage
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing
