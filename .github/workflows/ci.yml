name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile \
            main.py config.py utils.py exporters.py transcriber.py \
            batch_processor.py \
            core/logger.py core/prompts.py core/history.py core/i18n.py \
            core/recorder.py core/lm_client.py core/chat_worker.py \
            ui/theme.py ui/icons.py ui/settings_dialog.py \
            ui/transcript_view.py ui/main_window.py \
            ui/player_widget.py ui/history_panel.py \
            ui/toast.py ui/file_selector.py ui/recorder_widget.py \
            ui/chat_panel.py

      - name: Run unit tests
        run: python -m pytest tests/ -v
