name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.1.1 pytest-cov ruff==0.15.20 mypy==1.17.1

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q -x '__pycache__|\.git|venv|\.venv|docs/archive' .

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Type check (mypy, informational)
        # Not a merge gate yet: the codebase isn't fully typed. Surfaced as a
        # visible (but non-blocking) CI result so regressions are seen early.
        continue-on-error: true
        run: |
          mypy --ignore-missing-imports core/ transcriber.py diarizer.py exporters.py utils.py config.py

      - name: Run unit tests with coverage
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing

  qt-smoke:
    name: Real-Qt smoke (tests_qt)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyQt6 links these even under the offscreen platform plugin; the
      # GitHub ubuntu image does not ship them.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Qt test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-qt-ci.txt

      # Unlike tests/, this suite runs against real PyQt6 — tests/conftest.py
      # installs stand-in modules, so the two suites must never share a run.
      - name: Run real-Qt smoke suite
        run: python -m pytest tests_qt/ -v

  windows:
    name: Windows package (Python 3.11)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock -r requirements-build-windows.txt

      - name: Syntax check and lint
        run: |
          python -m compileall -q -x '__pycache__|\.git|venv|\.venv|build|dist|docs/archive' .
          ruff check .

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Build frozen package
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/windows packaging/windows/Whispered.windows.spec

      - name: Frozen smoke test
        shell: pwsh
        run: |
          & .\dist\Whispered\Whispered.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive unsigned package
        shell: pwsh
        run: Compress-Archive -Path .\dist\Whispered\* -DestinationPath .\dist\Whispered-windows-x64.zip

      - name: Upload unsigned Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Whispered-windows-x64-unsigned
          path: dist/Whispered-windows-x64.zip
