name: Release

# Manual only — never on push. Trigger from the Actions tab (or
# `gh workflow run release.yml -f version=v0.1.0`). The job builds the
# macOS .app, the Windows onedir package and the Linux (Fedora) tarball
# (linux-package.yml, also runnable on its own),
# attaches all three plus a SHA256SUMS file to a GitHub Release, and (by
# default) leaves it as a draft for a human to review and publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.1.0 (must match pyproject.toml version)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft (recommended)"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark the release as a pre-release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python tools/check_release_version.py "$RELEASE_VERSION"

  macos:
    name: macOS .app (Apple Silicon)
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pyinstaller==6.21.0

      - name: Build self-contained .app
        # --bundle-libs stashes the whisper stack inside the bundle;
        # --no-libs skips the developer-only deploy to ~/Library.
        run: python build.py --bundle-libs --no-libs

      - name: Frozen smoke test
        run: ./dist/Whispered.app/Contents/MacOS/Whispered --smoke-test

      - name: Package
        run: |
          ditto -c -k --keepParent dist/Whispered.app \
            "Whispered-${RELEASE_VERSION}-macos-arm64.zip"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: "Whispered-${{ inputs.version }}-macos-arm64.zip"
          if-no-files-found: error

  windows:
    name: Windows package (x64)
    needs: validate
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock -r requirements-build-windows.txt

      - name: Build frozen package
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/windows packaging/windows/Whispered.windows.spec

      - name: Frozen smoke test
        shell: pwsh
        run: |
          & .\dist\Whispered\Whispered.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path .\dist\Whispered\* -DestinationPath ".\Whispered-${env:RELEASE_VERSION}-windows-x64.zip"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: "Whispered-${{ inputs.version }}-windows-x64.zip"
          if-no-files-found: error

  linux:
    name: Linux package
    needs: validate
    uses: ./.github/workflows/linux-package.yml
    with:
      version: ${{ inputs.version }}

  release:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    # The Linux tarball is a preview channel (CLAUDE.md rule 6): its failure
    # must not block the macOS/Windows release. Whatever Linux produced, if
    # anything, is attached; nothing is attached when it failed.
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum Whispered-* | tee SHA256SUMS.txt

      - name: Resolve release notes
        id: notes
        run: |
          file="docs/release-notes/${RELEASE_VERSION}.md"
          if [ -f "$file" ]; then
            echo "Using $file"
            cp "$file" RELEASE_BODY.md
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $file — GitHub will auto-generate the body."
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version }}
          name: Whispered ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          body_path: ${{ steps.notes.outputs.have_notes == 'true' && 'RELEASE_BODY.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.have_notes != 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/Whispered-*
            artifacts/SHA256SUMS.txt
